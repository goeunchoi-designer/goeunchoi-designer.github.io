<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">From saved photos to personal keepsakes</title>
  <desc id="desc">Photos of a flower, a leaf, and a ticket become individual keepsakes inside a glass jar.</desc>
  <defs>
    <g id="flower"><path d="M0 38V-5M0 24C-24 26-27 12-27 12 0 9 0 24 0 24" fill="none" stroke="#474C41" stroke-width="4" stroke-linecap="round"/><g fill="#C2B6AB"><ellipse cy="-28" rx="10" ry="17"/><ellipse cy="-4" rx="10" ry="17"/><ellipse cx="-12" cy="-16" rx="17" ry="10"/><ellipse cx="12" cy="-16" rx="17" ry="10"/></g><circle cy="-16" r="8" fill="#806D5C"/></g>
    <g id="leaf"><path d="M-20 28C-40-14-7-39 29-34 35 3 13 35-20 28Z" fill="#8A9280"/><path d="m-24 37 40-55M-7 13l-11-18M-7 13l20-2" stroke="#FDFDFB" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    <g id="ticket"><rect x="-37" y="-24" width="74" height="48" rx="3" fill="#EDE6D6" stroke="#AE9D8F" stroke-width="2"/><path d="M17-23v46" stroke="#AE9D8F" stroke-width="2" stroke-dasharray="3 4"/><path d="M-24-8H5M-24 1H-4M-24 10H1" stroke="#806D5C" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <style>
    .photo-flower, .photo-leaf, .photo-ticket { animation:photo-fade 9s ease-in-out infinite; }
    .photo-leaf { animation-delay:.35s; }
    .photo-ticket { animation-delay:.7s; }
    .jar-flower { animation:keep-flower 9s cubic-bezier(.22,.61,.36,1) infinite; }
    .jar-leaf { animation:keep-leaf 9s cubic-bezier(.22,.61,.36,1) infinite; }
    .jar-ticket { animation:keep-ticket 9s cubic-bezier(.22,.61,.36,1) infinite; }
    .flow-arrow { animation:arrow-hint 9s ease-in-out infinite; }
    @keyframes photo-fade { 0%,8%,83%,100% { opacity:1; } 24%,69% { opacity:.2; } }
    @keyframes keep-flower {
      0%,9% { opacity:0; transform:translate(166px,239px) rotate(-8deg); }
      12% { opacity:1; }
      29% { transform:translate(920px,211px) rotate(12deg); }
      39% { transform:translate(876px,359px) rotate(-27deg); }
      44%,77% { opacity:1; transform:translate(876px,352px) rotate(-23deg); }
      88%,100% { opacity:0; transform:translate(876px,352px) rotate(-23deg); }
    }
    @keyframes keep-leaf {
      0%,16% { opacity:0; transform:translate(290px,216px); }
      19% { opacity:1; }
      36% { transform:translate(932px,202px) rotate(-18deg); }
      46% { transform:translate(964px,321px) rotate(32deg); }
      51%,77% { opacity:1; transform:translate(964px,315px) rotate(27deg); }
      88%,100% { opacity:0; transform:translate(964px,315px) rotate(27deg); }
    }
    @keyframes keep-ticket {
      0%,23% { opacity:0; transform:translate(414px,239px) rotate(8deg); }
      26% { opacity:1; }
      43% { transform:translate(920px,225px) rotate(18deg); }
      53% { transform:translate(953px,385px) rotate(-16deg); }
      58%,77% { opacity:1; transform:translate(953px,379px) rotate(-12deg); }
      88%,100% { opacity:0; transform:translate(953px,379px) rotate(-12deg); }
    }
    @keyframes arrow-hint { 0%,10%,70%,100% { opacity:.4; } 25%,50% { opacity:1; } }
    @media(prefers-reduced-motion:reduce) {
      .photo-flower, .photo-leaf, .photo-ticket, .jar-flower, .jar-leaf, .jar-ticket, .flow-arrow { animation:none; }
    }
  </style>
  <rect width="1200" height="560" fill="#fff"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="290" y="64" font-size="17" font-weight="700" letter-spacing="2" fill="#656462">SAVE A PHOTO</text>
    <text x="920" y="64" font-size="17" font-weight="700" letter-spacing="2" fill="#656462">KEEP A LITTLE MEMORY</text>
  </g>
  <g fill="#FAFAF8" stroke="#e8e8e8" stroke-width="2">
    <rect x="95" y="152" width="142" height="188" rx="8" transform="rotate(-8 166 246)"/>
    <rect x="219" y="126" width="142" height="188" rx="8"/>
    <rect x="343" y="152" width="142" height="188" rx="8" transform="rotate(8 414 246)"/>
  </g>
  <use class="photo-flower" href="#flower" transform="translate(166 239) rotate(-8)"/>
  <use class="photo-leaf" href="#leaf" transform="translate(290 216)"/>
  <use class="photo-ticket" href="#ticket" transform="translate(414 239) rotate(8)"/>
  <path class="flow-arrow" d="M559 256h89m-17-17 17 17-17 17" fill="none" stroke="#848381" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="920" cy="419" rx="122" ry="9" fill="#F0EFEA"/>
  <path d="M854 151v26c0 15-39 23-39 52v150c0 23 13 36 36 36h138c23 0 36-13 36-36V229c0-29-39-37-39-52v-26" fill="#FAFAF8" fill-opacity=".55" stroke="#848381" stroke-width="3"/>
  <rect x="845" y="132" width="150" height="22" rx="7" fill="#AE9D8F"/>
  <path d="M835 239v128" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <use class="jar-flower" href="#flower" transform="translate(876 352) rotate(-23) scale(1.05)"/>
  <use class="jar-leaf" href="#leaf" transform="translate(964 315) rotate(27)"/>
  <use class="jar-ticket" href="#ticket" transform="translate(953 379) rotate(-12)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="20" fill="#474C41">
    <text x="290" y="484">Something catches your eye.</text>
    <text x="920" y="484">Give it a place of its own.</text>
  </g>
</svg>
