<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">The product focus decision</title><desc id="desc">The product moved away from route tracking toward capture, a tactile jar, and personal browsing.</desc><rect width="1200" height="360" rx="24" fill="#111"/><text x="64" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#aaa">THE FOCUS SHIFT</text><g font-family="Arial,sans-serif"><g transform="translate(82 113)"><rect width="390" height="178" rx="14" fill="#292929" stroke="#555"/><text x="28" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#aaa">EARLY CONCEPT</text><text x="28" y="92" font-size="27" font-weight="700" fill="#fff">Routes + tracking</text><text x="28" y="130" font-size="17" fill="#ccc">More permissions and more scope</text><path d="M30 146h322" stroke="#777" stroke-width="2"/></g><path d="M520 202h132m-22-18 22 18-22 18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(725 113)"><rect width="390" height="178" rx="14" fill="#fff"/><text x="28" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#777">PRODUCT PROMISE</text><text x="28" y="92" font-size="27" font-weight="700" fill="#111">Collect + revisit</text><text x="28" y="130" font-size="17" fill="#555">A clearer habit and a tactile reward</text><path d="M30 146h322" stroke="#bbb" stroke-width="2"/></g></g></svg>
