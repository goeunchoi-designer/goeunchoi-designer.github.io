<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Four ways to browse a personal collection</title><desc id="desc">A jar, saved shelves, a calendar, and a location map connect to the same collection.</desc><rect width="1200" height="420" rx="24" fill="#fff"/><text x="64" y="58" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#777">ONE COLLECTION · FOUR ENTRY POINTS</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(78 96)"><rect width="238" height="250" rx="18" fill="#111"/><path d="M67 46h104l-8 27v94a12 12 0 0 1-12 12H87a12 12 0 0 1-12-12V73z" fill="#fff"/><path d="M67 47h104" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="111" cy="145" r="15" fill="#111"/><circle cx="139" cy="155" r="13" fill="#777"/><text x="119" y="225" font-size="18" font-weight="700" fill="#fff">Jar</text><text x="119" y="276" font-size="14" fill="#555">Play with the collection</text></g><g transform="translate(354 96)"><rect width="238" height="250" rx="18" fill="#f8f8f8" stroke="#ddd"/><path d="M32 91h174M32 130h174M32 169h174" stroke="#111" stroke-width="7" stroke-linecap="round"/><rect x="50" y="70" width="38" height="43" rx="8" fill="#777"/><rect x="123" y="110" width="38" height="43" rx="8" fill="#111"/><rect x="70" y="149" width="38" height="43" rx="8" fill="#444"/><text x="119" y="225" font-size="18" font-weight="700" fill="#111">Shelves</text><text x="119" y="276" font-size="14" fill="#555">Save named jars</text></g><g transform="translate(630 96)"><rect width="238" height="250" rx="18" fill="#f8f8f8" stroke="#ddd"/><rect x="53" y="48" width="132" height="130" rx="12" fill="#fff" stroke="#111" stroke-width="3"/><path d="M53 84h132M86 48v130M119 48v130M152 48v130M53 117h132M53 150h132" stroke="#bbb" stroke-width="2"/><g fill="#111"><circle cx="102" cy="100" r="6"/><circle cx="167" cy="134" r="6"/><circle cx="136" cy="165"