<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Current prototype and future product work</title><desc id="desc">The current prototype includes capture, manual details, jar physics, shelves, and local browsing. Identification, motion clips, appearance choice, and backup are future work.</desc><rect width="1200" height="400" rx="24" fill="#f8f8f8"/><g font-family="Arial,sans-serif"><text x="62" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#777">WHAT EXISTS · WHAT IS NEXT</text><rect x="62" y="91" width="516" height="258" rx="16" fill="#111"/><rect x="622" y="91" width="516" height="258" rx="16" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="91" y="133" font-size="16" font-weight="700" letter-spacing="2" fill="#fff">IN THE PROTOTYPE</text><text x="651" y="133" font-size="16" font-weight="700" letter-spacing="2" fill="#777">PLANNED, NOT AVAILABLE</text><g font-size="19" fill="#fff"><text x="92" y="181">✓  Photo capture and import</text><text x="92" y="220">✓  Manual name and category</text><text x="92" y="259">✓  Interactive jar and saved shelves</text><text x="92" y="298">✓  Local browsing and memory views</text></g><g font-size="19" fill="#444"><text x="652" y="181">○  Automatic object identification</text><text x="652" y="220">○  Motion clips</text><text x="652" y="259">○  Alternate jar appearances</text><text x="652" y="298">○  iCloud backup and restore</text></g><text x="62" y="378" font-size="14" fill="#777">iOS cutout is implemented. Android currently keeps the original photo.</text></g></svg>
