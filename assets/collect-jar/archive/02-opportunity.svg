<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Design opportunity between noticing and remembering</title><desc id="desc">Capture is intentionally quick, while detail and browsing happen at the user's own pace.</desc><rect width="1200" height="390" rx="24" fill="#111"/><text x="64" y="66" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#aaa">THE DESIGN OPPORTUNITY</text><g font-family="Arial,sans-serif"><text x="86" y="144" font-size="14" font-weight="700" letter-spacing="2" fill="#aaa">IN THE MOMENT</text><text x="86" y="194" font-size="34" font-weight="700" fill="#fff">Keep capture light</text><text x="86" y="230" font-size="18" fill="#ccc">One photo. No long form.</text><path d="M455 176h246m-22-20 22 20-22 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="755" y="144" font-size="14" font-weight="700" letter-spacing="2" fill="#aaa">WHEN IT FEELS RIGHT</text><text x="755" y="194" font-size="34" font-weight="700" fill="#fff">Add meaning later</text><text x="755" y="230" font-size="18" fill="#ccc">Name it. Sort it. Revisit it.</text></g><g transform="translate(490 273)" fill="none" stroke="#777"><circle cx="0" cy="0" r="10"/><circle cx="44" cy="0" r="10"/><circle cx="88" cy="0" r="10"/><circle cx="132" cy="0" r="10"/><path d="M10 0h24M54 0h24M98 0h24" stroke-width="2"/></g><text x="64" y="337" font-family="Arial,sans-serif" font-size="16" fill="#aaa">A quick action protects attention.</text><text x="755" y="337" font-family="Arial,sans-serif" font-size="16" fill="#aaa">A tactile collection gives people a reason to come back.</text></svg>
