<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Collect Jar product loop</title><desc id="desc">Notice, capture, add optional context, then collect the object in the jar.</desc><rect width="1200" height="360" rx="24" fill="#f8f8f8"/><path d="M175 164h850" stroke="#bbb" stroke-width="3" stroke-dasharray="7 10"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="175" cy="164" r="58" fill="#111"/><text x="175" y="173" font-size="27" fill="#fff">01</text><text x="175" y="267" font-size="22" font-weight="700" fill="#111">Notice</text><text x="175" y="297" font-size="16" fill="#666">Find a small detail</text></g><g><circle cx="458" cy="164" r="58" fill="#fff" stroke="#111" stroke-width="3"/><path d="M440 148h36v29h-36zM447 142h22" fill="none" stroke="#111" stroke-width="3"/><circle cx="458" cy="162" r="7" fill="none" stroke="#111" stroke-width="3"/><text x="458" y="267" font-size="22" font-weight="700" fill="#111">Capture</text><text x="458" y="297" font-size="16" fill="#666">Take or choose a photo</text></g><g><circle cx="742" cy="164" r="58" fill="#fff" stroke="#111" stroke-width="3"/><path d="M720 150h44M720 164h34M720 178h26" stroke="#111" stroke-width="3" stroke-linecap="round"/><text x="742" y="267" font-size="22" font-weight="700" fill="#111">Add context</text><text x="742" y="297" font-size="16" fill="#666">Name it now or later</text></g><g><circle cx="1025" cy="164" r="58" fill="#111"/><path d="M1004 144h42l-5 12v34h-32v-34z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="1018" cy="174" r="6" fill="#fff"/><circle cx="1032" cy="181" r="6" fill="#fff"/><text x="1025" y="267" font-size="22" font-weight="700" fill="#111">Collect</text><text x="1025" y="297" font-size="16" fill="#666">See it settle into the jar</text></g></g></svg>
