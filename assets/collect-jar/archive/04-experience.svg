<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Illustrated capture and collection screens</title><desc id="desc">Three phone panels show taking a picture, adding optional details, and moving the object into a jar.</desc><rect width="1200" height="520" rx="24" fill="#f8f8f8"/><text x="64" y="58" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#777">THE CORE EXPERIENCE · CONCEPT DIAGRAM</text><g font-family="Arial,sans-serif"><g transform="translate(96 93)"><rect width="270" height="355" rx="30" fill="#111"/><rect x="11" y="12" width="248" height="331" rx="22" fill="#fff"/><rect x="94" y="22" width="82" height="8" rx="4" fill="#111"/><text x="28" y="68" font-size="14" font-weight="700" fill="#111">Capture a find</text><rect x="30" y="88" width="210" height="166" rx="12" fill="#eee"/><path d="M64 223l46-75 38 47 28-30 38 58H64z" fill="#111"/><circle cx="202" cy="121" r="13" fill="#111"/><circle cx="135" cy="291" r="22" fill="none" stroke="#111" stroke-width="4"/><text x="135" y="331" text-anchor="middle" font-size="12" fill="#555">Take a photo</text></g><g transform="translate(466 93)"><rect width="270" height="355" rx="30" fill="#111"/><rect x="11" y="12" width="248" height="331" rx="22" fill="#fff"/><rect x="94" y="22" width="82" height="8" rx="4" fill="#111"/><text x="28" y="68" font-size="14" font-weight="700" fill="#111">Add details</text><rect x="28" y="94" width="214" height="42" rx="8" fill="#f8f8f8" stroke="#ddd"/><text x="42" y="120" font-size="13" fill="#555">Name</text><rect x="28" y="148" width="214" height="42" rx="8" fill="#f8f8f8" stroke="#ddd"/><text x="42" y="174" font-size="13" fill="#555">Category</text><rect x="28" y="202" width="214" height="66" rx="8" fill="#f8f8f8" stroke="#ddd"/><text x="42" y="228" font-size="13" fill="#555">Note · optional</text><rect x="28" y="287" width="214" height="38" rx="19" fill="#111"/><text x="135" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Save object</text></g><g transform="translate(836 93)"><rect width="270" height="355" rx="30" fill="#111"/><rect x="11" y="12" width="248" height="331" rx="22" fill="#fff"/><rect x="94" y="22" width="82" height="8" rx="4" fill="#111"/><text x="28" y="68" font-size="14" font-weight="700" fill="#111">Your collection</text><path d="M66 111h138l-12 39v143a14 14 0 0 1-14 14H92a14 14 0 0 1-14-14V150z" fill="#f8f8f8" stroke="#111" stroke-width="2"/><path d="M66 112h138" stroke="#111" stroke-width="5" stroke-linecap="round"/><circle cx="117" cy="254" r="20" fill="#111"/><circle cx="159" cy="267" r="17" fill="#777"/><circle cx="137" cy="218" r="17" fill="#444"/><text x="135" y="326" text-anchor="middle" font-size="12" fill="#555">Tilt · touch · explore</text></g></g><path d="M385 265h64m-12-12 12 12-12 12M755 265h64m-12-12 12 12-12 12" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
